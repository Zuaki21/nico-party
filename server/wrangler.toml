name = "nico-party"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# zuaki.dev のサブドメインで公開する（DNS と証明書は Cloudflare が自動で設定する）
routes = [{ pattern = "nico-party.zuaki.dev", custom_domain = true }]
# 旧 URL（workers.dev）は使わない（Discord の URL Mapping を切り替えたので無効にした）
workers_dev = false

# client を vite build した成果物を配信する。API 系だけ Worker で処理する
[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# "/" は Discord から開かれたか（frame_id の有無）で Activity 本体と案内ページを振り分ける
run_worker_first = ["/", "/api/*", "/ws/*", "/nico/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# 無料プランで使える SQLite バックエンドの Durable Object
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# 秘密ではない値。DISCORD_CLIENT_SECRET は `wrangler secret put` で登録する
DISCORD_CLIENT_ID = "1563868455646531737"

# 例外や console.error のログを Cloudflare のダッシュボードで見られるようにする
[observability]
enabled = true
