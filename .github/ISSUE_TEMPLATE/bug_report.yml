name: 不具合の報告
description: 動画が再生できない・同期がずれるなど、うまく動かないときに
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。わかる範囲で記入してください（空欄があっても大丈夫です）。
        アプリの設定画面の「不具合を報告」から送った報告 ID があれば、調査がかなり早くなります。
  - type: textarea
    id: what
    attributes:
      label: 何が起きたか
      description: どのような操作をして、どのような状況になったか
      placeholder: "例: 動画を追加したら、再生が始まらず読み込み中のままになった"
    validations:
      required: true
  - type: input
    id: report-id
    attributes:
      label: 報告 ID（任意）
      description: 設定画面の「不具合を報告」で送信したときに表示される 8 文字の ID
      placeholder: "例: D05A47A9"
  - type: dropdown
    id: platform
    attributes:
      label: 使っている環境
      options:
        - Windows（Discord アプリ）
        - macOS（Discord アプリ）
        - Linux（Discord アプリ）
        - ブラウザ版 Discord
        - iPhone / iPad
        - Android
        - その他
    validations:
      required: true
  - type: input
    id: detail
    attributes:
      label: 環境の詳細（任意）
      description: Linux なら Discord の入れ方（公式の .deb / tar.gz・flatpak・snap など）や、Wayland / X11 など
  - type: input
    id: video
    attributes:
      label: 動画の番号（任意）
      description: 特定の動画だけで起きる場合
      placeholder: "例: sm9"
  - type: input
    id: version
    attributes:
      label: バージョン（任意）
      description: 設定画面の左下、または読み込み画面の左下に出る「ver x.x.x」
